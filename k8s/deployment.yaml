apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudnative-go-lab
  labels:
    app: cloudnative-go-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudnative-go-lab
  template:
    metadata:
      labels:
        app: cloudnative-go-lab
    spec:
      containers:
        - name: api
          image: cloudnative-go-lab:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: cloudnative-go-lab-config
                  key: PORT
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
